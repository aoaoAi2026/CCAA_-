# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# Network optimizations
systemProp.http.connectTimeout=60000
systemProp.http.readTimeout=120000
systemProp.https.connectTimeout=60000
systemProp.https.readTimeout=120000
systemProp.http.maxConnections=8
# AndroidX
android.useAndroidX=true
android.enableJetifier=true
# Allow non-ASCII characters in project path (Windows)
android.overridePathCheck=true
# Disable JDK image generation (jlink compatibility fix for JDK 21)
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
# Auto accept SDK licenses
android.sdk.acceptLicense=true
android.builder.sdkDownload=true
